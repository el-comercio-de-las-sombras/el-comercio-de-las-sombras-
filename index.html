<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOP SECRET – El Comercio de las Sombras</title>
<style>
:root{--gold:#c7a760;--gold-light:#e1c27a}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#050505}
body{overflow:hidden;font-family:Georgia,"Times New Roman",serif}
.cover{position:relative;width:100vw;height:100vh;overflow:hidden;background:#050505}
.cover-image{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:center;display:block;
}
.cover::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to bottom,rgba(0,0,0,.01) 55%,rgba(0,0,0,.28) 100%),
             radial-gradient(circle at center,transparent 62%,rgba(0,0,0,.16) 100%);
}
.open-button{
  position:absolute;z-index:2;left:50%;bottom:5vh;transform:translateX(-50%);
  min-width:300px;padding:18px 36px;border:1px solid var(--gold);
  background:rgba(7,7,7,.88);color:var(--gold-light);text-decoration:none;
  text-align:center;text-transform:uppercase;letter-spacing:.14em;font-size:20px;
  box-shadow:0 14px 40px rgba(0,0,0,.65);backdrop-filter:blur(5px);transition:.2s ease;
}
.open-button:hover{background:var(--gold);color:#090807;transform:translateX(-50%) translateY(-3px)}
@media(max-width:700px){.open-button{min-width:220px;padding:15px 22px;font-size:16px;bottom:4vh}}
</style>
</head>
<body>
<main class="cover">
  <img class="cover-image" src="assets/images/akte-cover.png" alt="TOP SECRET – El Comercio de las Sombras">
  <a class="open-button" href="akte.html">Akte öffnen</a>
</main>
</body>
</html>
